<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>リアクションボタン — 4つのデザイン案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--background,#f6f7f9);color:var(--foreground,#202633);font-family:var(--font-sans,-apple-system),BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;font-size:14px}main{max-width:1160px;margin:auto;padding:32px 24px}header{margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted-foreground,#6b7280);font-weight:700}h1{font-size:28px;letter-spacing:-.7px;margin:10px 0}header p,.description{color:var(--muted-foreground,#657080);line-height:1.8}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #7265d8;outline-offset:3px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}.tool{border:1px solid var(--border,#dce0e6);background:var(--card,#fff);color:var(--foreground,#202633);padding:8px 12px;border-radius:8px}.tool:hover{background:var(--accent,#eeedf9);color:var(--accent-foreground,#302763)}.hint{font-size:12px;color:var(--muted-foreground,#6b7280)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.concept{border:1px solid var(--border,#dce0e6);border-radius:16px;background:var(--card,#fff);color:var(--card-foreground,#202633);overflow:hidden}.heading{padding:22px 24px 16px}.meta{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:1px;color:var(--muted-foreground,#6b7280)}.badge{letter-spacing:0;background:var(--secondary,#eef0f4);color:var(--secondary-foreground,#445063);padding:4px 8px;border-radius:5px}h2{font-size:19px;margin:10px 0 0}.description{margin:9px 0 0;font-size:12px}.stage{margin:0 16px;background:#f3f5f8;padding:22px 18px;border-radius:10px;color:#283142;color-scheme:light;min-height:242px}.post{background:#fff;border:1px solid #e3e7ed;border-radius:10px;padding:17px}.author{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:650}.avatar{display:grid;place-items:center;border-radius:50%;width:32px;height:32px;background:#dce8e3;color:#376051}.time{display:block;font-size:10px;color:#7b8490;font-weight:400;margin-top:3px}.post p{font-size:13px;margin:15px 0 18px;line-height:1.8}.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.rx{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#fff;color:#637083;border:1px solid transparent;min-height:34px;padding:5px 10px;border-radius:8px;font-size:13px;transition:background .16s,transform .16s}.rx:hover{background:#f0f3f7;transform:translateY(-1px)}.emoji{font-size:18px;line-height:1.2}.num{font-size:12px;font-variant-numeric:tabular-nums}.check{font-size:10px;display:none}.rx[aria-pressed=true] .check{display:inline}.a .rx{background:#f4f5f7;border:1px solid #e5e7eb;border-radius:18px;gap:5px;padding:4px 9px}.a .rx[aria-pressed=true]{background:#eaf2ff;border-color:#7da9ec;color:#235ca8}.a .rx:hover{background:#eaf0f8}.a .add{border-style:dashed;color:#7c8796}.b .bar{border-top:1px solid #eceff3;padding-top:11px}.b .rx[aria-pressed=true]{background:#edf4ff;color:#2464bf}.picker{padding:10px;background:white;border:1px solid #e1e5eb;border-radius:14px;box-shadow:0 6px 18px #17274012;display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}.picker .rx{flex:1;flex-direction:column;gap:5px;padding:7px 5px;min-width:53px}.picker .label{font-size:10px;white-space:nowrap}.picker .emoji{font-size:24px}.b .stage{min-height:242px}.b .post p{margin-bottom:12px}.summary{font-size:11px;color:#76808e;margin-bottom:12px}.more{border:0;background:#f1f3f6;border-radius:7px;color:#596879;min-height:34px;padding:5px 10px}.c .bar{gap:18px;border-top:1px solid #edf0f3;padding-top:12px}.c .rx{padding:4px 0;gap:7px}.c .rx[aria-pressed=true]{color:#d83368}.lineicon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.c .rx[aria-pressed=true] .lineicon{fill:#fce1e9;stroke-width:2.2}.c .rx:first-child[aria-pressed=true] .lineicon{fill:#e34677;stroke:#e34677}.c .check{font-size:10px}.d .bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.d .rx{justify-content:flex-start;border:1px solid #e5e8ef;border-radius:9px;font-size:11px;min-height:38px;padding:7px 9px;gap:6px}.d .num{margin-left:auto;font-size:11px}.d .rx[aria-pressed=true]{background:#f0edff;border-color:#aaa0e8;color:#6754b0}.d .emoji{font-size:17px}.foot{padding:15px 24px 19px;font-size:12px;line-height:1.7;color:var(--muted-foreground,#657080)}.foot strong{color:var(--foreground,#303a49);font-weight:600}.people{background:none;border:0;color:#788393;font-size:10px;padding:10px 0 0;text-decoration:underline;text-underline-offset:3px}.people-panel{font-size:11px;color:#626f80;background:#f6f8fb;border-radius:6px;padding:10px;line-height:1.7;margin-top:8px}.sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}footer{margin-top:20px;font-size:11px;color:var(--muted-foreground,#6b7280);line-height:1.8}[hidden]{display:none!important}.compact .grid{grid-template-columns:1fr;max-width:390px;margin:auto}.compact .stage{padding:16px 10px}.compact .heading{padding:20px}.compact .c .bar{gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:24px 12px}h1{font-size:24px}}@media(max-width:380px){.stage{padding:14px 8px;margin:0 10px}.post{padding:13px}.c .bar{gap:12px}.d .rx{font-size:10px}}@media(prefers-reduced-motion:reduce){.rx{transition:none}.rx:hover{transform:none}}

/* C案: 意図が伝わるラベルと、移動・注目を表す線画。 */
.c .bar{column-gap:18px;row-gap:8px}.c .rx{min-height:40px;white-space:nowrap}.c .rx[data-i="2"],.c .rx[data-i="3"]{padding:5px 7px;gap:5px}.c .label{font-size:11px;font-weight:500}.c .lineicon{flex-shrink:0}.c .rx[data-i="2"][aria-pressed=true]{color:#247457}.c .rx[data-i="2"][aria-pressed=true] .lineicon{fill:#e6f4ed}.c .rx[data-i="3"][aria-pressed=true]{color:#7851b0}.c .rx[data-i="3"][aria-pressed=true] .lineicon{fill:#f0eafa}
</style></head><body><main>
<header><div class="eyebrow">REACTION DESIGN STUDY / KINTONE</div><h1>いつもの感覚で、気軽にリアクション。</h1><p>同じ投稿・同じ4種類で比較する、SNSをヒントにしたボタンのデザイン案。</p><div class="tools"><button class="tool" id="size" aria-pressed="false">狭い幅で比較</button><button class="tool" id="reset">選択をリセット</button><span class="hint">ボタンを押すと件数が増減します。複数選択できます。</span></div></header>
<div class="grid" id="grid"></div><div class="sr" role="status" id="status"></div>
<footer>デザイン検討用のモックアップです。表示データはサンプルで、kintoneへの保存は行いません。<br>既存の「いいね・お気に入り・行きたい・気になる」を維持。C案では「お気に入り」をハートで表現し、「行きたい」を「行ってみたい」と表示しています。各案の選択状態は独立しています。</footer>
</main><script>
const defs=[['👍','いいね',12],['⭐','お気に入り',8],['📍','行きたい',3],['👀','気になる',5]];
const concepts=[['a','01 / CHAT STYLE','チップ型','Slack・Discordのような、小さな絵文字と件数の組み合わせ。','一覧におすすめ','少ない面積で4種類を並べられ、現在の構成から移行しやすい案。'],['b','02 / SOCIAL STYLE','いいね＋パレット型','Facebookをヒントに、主ボタンと追加リアクションを分ける案。','詳細画面向け','よく使う「いいね」を手前に。ほかの種類はパレットから選択。'],['c','03 / MINIMAL STYLE','アウトラインアイコン型','Instagram・Xのような、余白と線画アイコンを生かした案。','すっきり見せる','「行ってみたい」「気になる」はラベルを常時表示。移動先のピンと、注目を表す目のアイコンで意味を補います。'],['d','04 / FRIENDLY STYLE','ラベル付きボタン型','SNSの親しみやすさに、業務画面でのわかりやすさを加えた案。','初めてでもわかる','絵文字・名前・件数を常時表示。ボタンの意味に迷いにくい案。']];
const paths=['M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z','M7 10V21H3V10h4Zm0 10h10a2 2 0 0 0 2-1.6l2-8a2 2 0 0 0-2-2.4h-6l1-5c0-2-2-2-3 0L7 10','M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0ZM15 10a3 3 0 1 1-6 0 3 3 0 0 1 6 0','M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0'];
const states={};
function reactionLabel(type,i){return type==="c" && i===2 ? "行ってみたい" : defs[i][1]}
const clearIcons={2:"M17 8a5 5 0 1 0-10 0c0 3.5 5 8 5 8s5-4.5 5-8ZM13.5 8a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0M3 21h11a3 3 0 0 0 0-6h-1M3 21l3-3M3 21l3 2",3:"M2 13s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6ZM14 13a3 3 0 1 1-6 0 3 3 0 0 1 6 0M18 2v4M16 4h4M22 8v2"};
function button(type,i,palette=false){const [emoji,,count]=defs[i];const label=reactionLabel(type,i);const icon=type==='c'?'<svg class="lineicon" aria-hidden="true" viewBox="0 0 24 24"><path d="'+(clearIcons[i]||paths[i===0?1:i===1?0:i])+'"/></svg>':'<span class="emoji" aria-hidden="true">'+emoji+'</span>';return '<button class="rx" data-i="'+i+'" aria-pressed="false" title="'+label+'">'+icon+((type==='d'||type==='b'||(type==='c'&&i>=2))?'<span class="label">'+label+'</span>':'')+'<span class="num">'+count+'</span><span class="check" aria-hidden="true">✓</span></button>'}
for(const [type,no,title,desc,badge,note] of concepts){states[type]=[false,false,false,false];const order=type==='c'?[1,0,2,3]:[0,1,2,3];const buttons=order.map(i=>button(type,i)).join('');const reactions=type==='b'?'<div class="picker" id="palette-b" hidden>'+[1,2,3].map(i=>button(type,i,true)).join('')+'</div><div class="bar">'+button(type,0)+'<button class="more" aria-controls="palette-b" aria-expanded="false">＋ リアクション</button></div>':'<div class="bar">'+buttons+'</div>';document.querySelector('#grid').insertAdjacentHTML('beforeend','<article class="concept '+type+'" data-type="'+type+'"><div class="heading"><div class="meta">'+no+'<span class="badge">'+badge+'</span></div><h2>'+title+'</h2><p class="description">'+desc+'</p></div><div class="stage"><div class="post"><div class="author"><span class="avatar">田</span><div>田中 美咲<span class="time">社内イベント / 今日 10:30</span></div></div><p>来月の交流会、企画を公開しました。<br>気になる方はリアクションで教えてください！</p>'+reactions+'<button class="people" aria-expanded="false">リアクションした人を見る</button><div class="people-panel" hidden></div></div></div><div class="foot"><strong>使いどころ</strong> ─ '+note+'</div></article>')}
function render(article){const type=article.dataset.type;article.querySelectorAll('.rx').forEach(b=>{const i=+b.dataset.i,on=states[type][i],n=defs[i][2]+Number(on);b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',reactionLabel(type,i)+'、'+n+'件、'+(on?'選択済み。押して解除':'押して追加'));b.querySelector('.num').textContent=n});article.querySelector('.people-panel').innerHTML=defs.map((d,i)=>d[0]+' '+d[1]+'：佐藤、鈴木'+(states[type][i]?'、あなた':'')+' ほか').join('<br>')}
document.querySelectorAll('.concept').forEach(article=>{render(article);article.addEventListener('click',e=>{const rx=e.target.closest('.rx');if(rx){const i=+rx.dataset.i;states[article.dataset.type][i]=!states[article.dataset.type][i];render(article);document.querySelector('#status').textContent=defs[i][1]+(states[article.dataset.type][i]?'を追加しました':'を解除しました')}const more=e.target.closest('.more');if(more){const p=article.querySelector('.picker');p.hidden=!p.hidden;more.setAttribute('aria-expanded',String(!p.hidden))}const people=e.target.closest('.people');if(people){const p=article.querySelector('.people-panel');p.hidden=!p.hidden;people.setAttribute('aria-expanded',String(!p.hidden))}})});
document.querySelector('#size').onclick=e=>{const compact=document.querySelector('main').classList.toggle('compact');e.currentTarget.setAttribute('aria-pressed',String(compact));e.currentTarget.textContent=compact?'通常の幅に戻す':'狭い幅で比較'};
document.querySelector('#reset').onclick=()=>{document.querySelectorAll('.concept').forEach(a=>{states[a.dataset.type]=[false,false,false,false];render(a);a.querySelector('.people-panel').hidden=true;a.querySelector('.people').setAttribute('aria-expanded','false')});document.querySelector('.picker').hidden=true;document.querySelector('.more').setAttribute('aria-expanded','false');document.querySelector('#status').textContent='すべての選択をリセットしました'};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('.picker').hidden){document.querySelector('.picker').hidden=true;const b=document.querySelector('.more');b.setAttribute('aria-expanded','false');b.focus()}});
</script></body></html>
