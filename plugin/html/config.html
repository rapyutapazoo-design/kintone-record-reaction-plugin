<div class="krx-config">
  <h1>レコードリアクション プラグイン設定</h1>

  <div id="krx-config-notice" class="krx-config-notice" style="display:none"></div>

  <div class="krx-config-field">
    <label for="krx-token">APIトークン</label>
    <input type="password" id="krx-token" placeholder="変更する場合のみ入力" autocomplete="off" />
    <p class="krx-config-hint">
      空欄で保存すると、既存のトークンを引き継ぎます。このアプリの「レコード閲覧」「レコード編集」のみ許可したAPIトークンを入力してください。
    </p>
  </div>

  <div class="krx-config-field">
    <button type="button" id="krx-test-connection">接続テスト</button>
    <span id="krx-test-result"></span>
  </div>

  <div class="krx-config-field">
    <label for="krx-default-space">共通の配置先スペース</label>
    <select id="krx-default-space"></select>
    <p id="krx-default-space-warning" class="krx-config-warning" style="display:none"></p>
    <p class="krx-config-hint">フォームにスペースを配置し要素IDを設定すると選択できます。リアクションごとの配置先が未指定のときに使います。</p>
  </div>

  <div id="krx-mapping-root" class="krx-config-section"></div>
  <div id="krx-reactions-root" class="krx-config-section"></div>
  <div id="krx-display-root" class="krx-config-section"></div>

  <div id="plugin-config-errormsg"></div>

  <button type="button" id="krx-save" class="krx-btn-save">設定を保存</button>
  <button type="button" id="krx-cancel" class="krx-btn-cancel">キャンセル</button>
</div>
